name: Fixture CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: python -m build
      - run: ruff check .
      - run: git diff-tree --root -m --check HEAD
      - run: python -m pytest -q
      - run: python scripts/smoke_mcp.py
      - run: python scripts/validate_docs.py
      - name: Scan repository history for secrets
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo:ro" \
            ghcr.io/gitleaks/gitleaks:v8.24.3 git /repo --redact

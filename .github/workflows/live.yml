name: Weekly public YouTube API smoke
on:
  schedule:
    - cron: '18 10 * * 1'
permissions:
  contents: read
concurrency:
  group: youtube-live-smoke
  cancel-in-progress: false

jobs:
  public-read:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      LIVE_GENERAL_CAP: '200'
      LIVE_SEARCH_CAP: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - run: python scripts/live_smoke.py
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_LIVE_SMOKE_API_KEY }}

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-mcp-server"
version = "0.1.0"
description = "MCP server for YouTube discovery, recommendations, engagement analysis, and playlist creation"
requires-python = ">=3.12,<3.13"
dependencies = ["httpx>=0.28,<1", "keyring>=25,<26", "mcp>=2,<3", "platformdirs>=4,<5", "tzdata"]

[project.optional-dependencies]
dev = ["build>=1,<2", "pytest>=8,<10", "ruff>=0.12,<1", "PyYAML>=6,<7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
